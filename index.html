<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Anotar gasto / ingreso</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --bg2:var(--tg-theme-secondary-bg-color,#f1f2f6);
  --text:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#8a8f98);
  --link:var(--tg-theme-link-color,#2481cc);
  --btn:var(--tg-theme-button-color,#2481cc);
  --btn-text:var(--tg-theme-button-text-color,#fff);
  --danger:var(--tg-theme-destructive-text-color,#e53935);
  --ok:#2e9e5b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);
  font-size:16px;user-select:none;-webkit-user-select:none}
#app{max-width:480px;margin:0 auto;padding:10px 14px calc(16px + env(safe-area-inset-bottom));min-height:100%;display:flex;flex-direction:column}
.notice{background:#fff4d6;color:#6b5000;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:8px}
#bal{color:var(--hint);font-size:13px;text-align:center;margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top{display:flex;align-items:center;gap:8px;min-height:28px;margin-bottom:6px}
.top h2{font-size:17px;margin:0;flex:1}
.back{background:none;border:0;color:var(--link);font-size:16px;padding:4px 6px;cursor:pointer}
.steps{color:var(--hint);font-size:13px}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--text);font-size:16px;font-weight:600;padding:9px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button.on[data-t=g]{color:var(--danger)}
.seg button.on[data-t=i]{color:var(--ok)}
.amount{text-align:center;margin:14px 0 6px;font-weight:700;font-size:clamp(34px,11vw,52px);line-height:1.1;word-break:break-all}
.amount .cur{font-size:.45em;color:var(--hint);font-weight:600;margin-left:6px}
.amount.zero .num{color:var(--hint)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
.chip{border:1.5px solid var(--bg2);background:var(--bg2);color:var(--text);border-radius:999px;padding:8px 16px;font-size:15px;cursor:pointer}
.chip.on{border-color:var(--btn);background:var(--btn);color:var(--btn-text)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto;padding-top:10px}
.pad button{border:0;background:var(--bg2);color:var(--text);font-size:26px;font-weight:500;border-radius:14px;height:clamp(48px,8.5vh,64px);cursor:pointer}
.pad button:active,.cat:active,.chip:active{opacity:.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.cat{border:1.5px solid var(--bg2);background:var(--bg2);color:var(--text);border-radius:14px;padding:12px 6px;min-height:74px;
  font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.cat .e{font-size:24px}
.cat.on{border-color:var(--btn)}
label.lbl{display:block;color:var(--hint);font-size:13px;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.03em}
.chips.left{justify-content:flex-start}
input[type=date],input[type=text]{width:100%;font:inherit;color:var(--text);background:var(--bg2);border:0;border-radius:12px;padding:11px 12px;user-select:text;-webkit-user-select:text}
input[type=date]{margin-top:8px}
.count{color:var(--hint);font-size:12px;text-align:right;margin-top:3px}
.sum{background:var(--bg2);border-radius:14px;padding:4px 14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid rgba(128,128,128,.18)}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--hint)}
.row span:last-child{text-align:right;word-break:break-word;font-weight:600}
.big{font-size:22px}
.fbtn{display:block;width:100%;border:0;border-radius:12px;background:var(--btn);color:var(--btn-text);font-size:16px;font-weight:600;padding:14px;margin-top:14px;cursor:pointer}
.fbtn:disabled{opacity:.45}
pre{background:var(--bg2);border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-all;font-size:13px;user-select:text;-webkit-user-select:text}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="notice" class="notice hidden">Abierta fuera de Telegram: modo de prueba. Al guardar se muestra el JSON que se enviaría al bot.</div>
  <p id="bal" class="hidden"></p>
  <div class="top">
    <button id="back" class="back hidden" type="button">‹ Atrás</button>
    <h2 id="title">Nuevo movimiento</h2>
    <span id="steps" class="steps">1/4</span>
  </div>

  <!-- 1: tipo + monto -->
  <section class="screen on" id="s1">
    <div class="seg" id="tipo">
      <button type="button" data-t="g" class="on">Gasto</button>
      <button type="button" data-t="i">Ingreso</button>
    </div>
    <div class="amount zero" id="amount"><span class="num" id="amtNum">0</span><span class="cur" id="amtCur">CUP</span></div>
    <div class="chips" id="mon"></div>
    <div class="pad" id="pad">
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
      <button type="button" data-k=",">,</button><button type="button" data-k="0">0</button><button type="button" data-k="del" aria-label="Borrar">⌫</button>
    </div>
  </section>

  <!-- 2: categoría -->
  <section class="screen" id="s2">
    <div class="grid" id="cats"></div>
  </section>

  <!-- 3: detalles -->
  <section class="screen" id="s3">
    <label class="lbl">Cuenta</label>
    <div class="chips left" id="cuentas"></div>
    <label class="lbl">Fecha</label>
    <div class="chips left" id="fechas">
      <button type="button" class="chip on" data-f="hoy">Hoy</button>
      <button type="button" class="chip" data-f="ayer">Ayer</button>
      <button type="button" class="chip" data-f="otra">Otra…</button>
    </div>
    <input type="date" id="fechaInput" class="hidden">
    <label class="lbl" for="nota">Nota (opcional)</label>
    <input type="text" id="nota" maxlength="100" placeholder="Ej.: almuerzo con amigos" autocomplete="off" enterkeyhint="done">
    <div class="count" id="notaCount">0/100</div>
  </section>

  <!-- 4: confirmar -->
  <section class="screen" id="s4">
    <div class="sum" id="sum"></div>
    <div id="out" class="hidden">
      <label class="lbl">JSON que se enviaría (prueba)</label>
      <pre id="json"></pre>
    </div>
  </section>

  <button id="fbtn" class="fbtn hidden" type="button">Siguiente</button>
</div>

<script>
(function () {
  'use strict';

  // Solo nombres de categorías (sin datos personales).
  var CATS_G = ['Comida', 'Transporte', 'Vivienda', 'Suministros (luz, agua, gas, etc.)', 'Salud/médicos',
    'Gastos personales', 'Mascotas', 'Viajes', 'Regalos', 'Deuda', 'Otros'];
  var CATS_I = ['Sueldo', 'Freelance', 'Bonificaciones', 'Intereses', 'Ahorro', 'Otros'];
  var EMOJI = {
    'Comida': '🍽️', 'Transporte': '🚕', 'Vivienda': '🏠', 'Suministros (luz, agua, gas, etc.)': '💡',
    'Salud/médicos': '💊', 'Gastos personales': '👕', 'Mascotas': '🐾', 'Viajes': '✈️', 'Regalos': '🎁',
    'Deuda': '💳', 'Otros': '📦', 'Sueldo': '💼', 'Freelance': '🧑‍💻', 'Bonificaciones': '⭐',
    'Intereses': '📈', 'Ahorro': '🐷'
  };
  var CURRENCIES = ['CUP', 'USD', 'UYU'];
  var CUENTAS = ['Efectivo', 'Banco', 'PayPal'];
  var TITLES = ['', 'Nuevo movimiento', 'Categoría', 'Detalles', 'Confirmar'];
  var MAX_INT_DIGITS = 9;

  var wa = (window.Telegram && window.Telegram.WebApp) || null;
  // Abierta desde un KeyboardButton, initData llega vacío: detectar Telegram por platform.
  var inTg = !!(wa && typeof wa.sendData === 'function' && wa.platform && wa.platform !== 'unknown');
  // Con initData presente se abrió desde el menú o un botón inline, donde sendData no hace nada.
  var canSend = inTg && !wa.initData;
  var $ = function (id) { return document.getElementById(id); };

  var st = { step: 1, t: 'g', amt: '', mon: 'CUP', cat: null, cuenta: 'Efectivo', fechaMode: 'hoy', fechaOtra: '', nota: '' };

  // ---- utilidades ----
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function today() { return ymd(new Date()); }
  function yesterday() { var d = new Date(); d.setDate(d.getDate() - 1); return ymd(d); }
  function fecha() {
    if (st.fechaMode === 'ayer') return yesterday();
    if (st.fechaMode === 'otra' && /^\d{4}-\d{2}-\d{2}$/.test(st.fechaOtra)) return st.fechaOtra;
    return today();
  }
  function montoNum() {
    if (!st.amt) return 0;
    var n = Number(st.amt.replace(',', '.'));
    return isFinite(n) ? Math.round(n * 100) / 100 : 0;
  }
  function fmtAmt(s) {
    if (!s) return '0';
    var parts = s.split(',');
    var ip = parts[0] || '0';
    ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return parts.length > 1 ? ip + ',' + parts[1] : ip;
  }
  function fmtMonto(n) {
    var fixed = n.toFixed(2).split('.');
    var s = fixed[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return fixed[1] === '00' ? s : s + ',' + fixed[1];
  }
  function fmtFecha(f) {
    var p = f.split('-');
    var label = f === today() ? 'Hoy, ' : (f === yesterday() ? 'Ayer, ' : '');
    return label + p[2] + '/' + p[1] + '/' + p[0];
  }
  function cleanText(s, max) {
    return String(s || '').replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max);
  }
  function haptic(kind, arg) {
    try {
      if (!wa || !wa.HapticFeedback) return;
      if (kind === 'sel') wa.HapticFeedback.selectionChanged();
      else if (kind === 'imp') wa.HapticFeedback.impactOccurred(arg || 'light');
      else if (kind === 'not') wa.HapticFeedback.notificationOccurred(arg || 'success');
    } catch (e) { /* versión antigua */ }
  }

  // ---- payload (contrato v1) ----
  function buildPayload() {
    return {
      v: 1,
      t: st.t,
      monto: montoNum(),
      mon: st.mon,
      cat: st.cat || 'Otros',
      cuenta: st.cuenta,
      fecha: fecha(),
      nota: cleanText(st.nota, 100)
    };
  }

  // ---- URL params ----
  try {
    var qs = new URLSearchParams(location.search);
    var m = (qs.get('mon') || '').toUpperCase();
    if (CURRENCIES.indexOf(m) >= 0) st.mon = m;
    var bal = qs.get('bal');
    if (bal !== null) {
      bal = cleanText(bal, 120);
      if (bal) { $('bal').textContent = bal; $('bal').classList.remove('hidden'); }
    }
  } catch (e) { /* sin URLSearchParams */ }

  // ---- render ----
  function chipList(el, items, current, attr) {
    el.textContent = '';
    items.forEach(function (it) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (it === current ? ' on' : '');
      b.setAttribute(attr, it);
      b.textContent = it;
      el.appendChild(b);
    });
  }
  function renderAmount() {
    $('amtNum').textContent = fmtAmt(st.amt);
    $('amtCur').textContent = st.mon;
    $('amount').classList.toggle('zero', montoNum() <= 0);
  }
  function renderCats() {
    var list = st.t === 'i' ? CATS_I : CATS_G;
    var el = $('cats');
    el.textContent = '';
    list.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'cat' + (c === st.cat ? ' on' : '');
      b.setAttribute('data-cat', c);
      var e = document.createElement('span'); e.className = 'e'; e.textContent = EMOJI[c] || '•';
      var n = document.createElement('span'); n.textContent = c;
      b.appendChild(e); b.appendChild(n);
      el.appendChild(b);
    });
  }
  function renderSummary() {
    var p = buildPayload();
    var rows = [
      ['Tipo', p.t === 'g' ? 'Gasto' : 'Ingreso'],
      ['Monto', fmtMonto(p.monto) + ' ' + p.mon],
      ['Categoría', p.cat],
      ['Cuenta', p.cuenta],
      ['Fecha', fmtFecha(p.fecha)]
    ];
    if (p.nota) rows.push(['Nota', p.nota]);
    var el = $('sum');
    el.textContent = '';
    rows.forEach(function (r, i) {
      var d = document.createElement('div'); d.className = 'row';
      var a = document.createElement('span'); a.textContent = r[0];
      var b = document.createElement('span'); b.textContent = r[1];
      if (i === 1) b.className = 'big';
      d.appendChild(a); d.appendChild(b); el.appendChild(d);
    });
  }

  function mainState() {
    if (st.step === 1) return { text: 'Siguiente', visible: true, active: montoNum() > 0 };
    if (st.step === 2) return { text: 'Siguiente', visible: !!st.cat, active: !!st.cat };
    if (st.step === 3) return { text: 'Siguiente', visible: true, active: true };
    return { text: 'Guardar', visible: true, active: true };
  }
  function syncButtons() {
    var ms = mainState();
    if (inTg) {
      try {
        wa.MainButton.setText(ms.text);
        if (ms.visible) wa.MainButton.show(); else wa.MainButton.hide();
        if (ms.active) wa.MainButton.enable(); else wa.MainButton.disable();
      } catch (e) {}
      try { if (st.step > 1) wa.BackButton.show(); else wa.BackButton.hide(); } catch (e) {}
    } else {
      var f = $('fbtn');
      f.textContent = ms.text;
      f.classList.toggle('hidden', !ms.visible);
      f.disabled = !ms.active;
    }
    var backSupported = inTg && wa.BackButton && (!wa.isVersionAtLeast || wa.isVersionAtLeast('6.1'));
    $('back').classList.toggle('hidden', backSupported || st.step === 1);
  }
  function go(step) {
    st.step = step;
    for (var i = 1; i <= 4; i++) $('s' + i).classList.toggle('on', i === step);
    $('title').textContent = TITLES[step];
    $('steps').textContent = step + '/4';
    if (step === 2) renderCats();
    if (step === 4) { renderSummary(); $('out').classList.add('hidden'); }
    syncButtons();
    window.scrollTo(0, 0);
  }

  // ---- acciones ----
  function key(k) {
    var s = st.amt;
    if (k === 'del') s = s.slice(0, -1);
    else if (k === ',') { if (s.indexOf(',') < 0) s = (s || '0') + ','; }
    else {
      var parts = s.split(',');
      if (parts.length > 1) { if (parts[1].length < 2) s += k; }
      else if (s === '0') s = k;
      else if (s.length < MAX_INT_DIGITS) s += k;
    }
    if (s === '0' && k === 'del') s = '';
    st.amt = s;
    renderAmount();
    syncButtons();
  }
  function next() {
    if (st.step === 1) { if (montoNum() > 0) { haptic('imp', 'light'); go(2); } else haptic('not', 'error'); }
    else if (st.step === 2) { if (st.cat) go(3); }
    else if (st.step === 3) { haptic('imp', 'light'); go(4); }
    else save();
  }
  function back() {
    if (st.step > 1) { haptic('sel'); go(st.step - 1); }
  }
  var WRONG_LAUNCH = 'Ciérrala y ábrela con el botón «➕ Anotar» del teclado del chat (si no lo ves, manda /app).';
  function showErr(msg) {
    haptic('not', 'error');
    var n = $('notice'); n.textContent = msg; n.classList.remove('hidden'); window.scrollTo(0, 0);
  }
  function save() {
    var p = buildPayload();
    if (!(p.monto > 0)) { haptic('not', 'error'); go(1); return; }
    var json = JSON.stringify(p);
    if (new Blob([json]).size >= 4096) { haptic('not', 'error'); return; }
    if (inTg && !canSend) { showErr(WRONG_LAUNCH); return; }
    if (inTg) {
      haptic('not', 'success');
      try { wa.sendData(json); } catch (e) { showErr('No se pudo enviar (' + (e && e.message || e) + '). ' + WRONG_LAUNCH); return; }
      setTimeout(function () { showErr('Telegram no cerró la Mini App: el dato no se envió. ' + WRONG_LAUNCH); }, 2500);
    } else {
      $('json').textContent = json;
      $('out').classList.remove('hidden');
      window.__lastJson = json;
    }
  }

  // ---- eventos ----
  $('tipo').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-t]'); if (!b) return;
    var t = b.getAttribute('data-t');
    if (t !== st.t) { st.t = t; st.cat = null; haptic('sel'); }
    Array.prototype.forEach.call(this.children, function (c) { c.classList.toggle('on', c === b); });
  });
  $('pad').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-k]'); if (!b) return;
    haptic('imp', 'light');
    key(b.getAttribute('data-k'));
  });
  $('mon').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-mon]'); if (!b) return;
    st.mon = b.getAttribute('data-mon'); haptic('sel');
    chipList($('mon'), CURRENCIES, st.mon, 'data-mon'); renderAmount();
  });
  $('cats').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-cat]'); if (!b) return;
    st.cat = b.getAttribute('data-cat'); haptic('sel');
    renderCats(); go(3);
  });
  $('cuentas').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-cuenta]'); if (!b) return;
    st.cuenta = b.getAttribute('data-cuenta'); haptic('sel');
    chipList($('cuentas'), CUENTAS, st.cuenta, 'data-cuenta');
  });
  $('fechas').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-f]'); if (!b) return;
    st.fechaMode = b.getAttribute('data-f'); haptic('sel');
    Array.prototype.forEach.call(this.children, function (c) { c.classList.toggle('on', c === b); });
    var inp = $('fechaInput');
    inp.classList.toggle('hidden', st.fechaMode !== 'otra');
    if (st.fechaMode === 'otra') { if (!inp.value) inp.value = today(); st.fechaOtra = inp.value; }
  });
  $('fechaInput').max = today();
  $('fechaInput').addEventListener('change', function () { st.fechaOtra = this.value; });
  $('nota').addEventListener('input', function () {
    st.nota = this.value.slice(0, 100);
    $('notaCount').textContent = st.nota.length + '/100';
  });
  $('nota').addEventListener('keydown', function (e) { if (e.key === 'Enter') this.blur(); });
  // teclado físico (pruebas en PC)
  document.addEventListener('keydown', function (e) {
    if (st.step !== 1) return;
    if (/^[0-9]$/.test(e.key)) key(e.key);
    else if (e.key === ',' || e.key === '.') key(',');
    else if (e.key === 'Backspace') key('del');
    else if (e.key === 'Enter') next();
  });
  $('back').addEventListener('click', back);
  $('fbtn').addEventListener('click', next);

  // ---- init ----
  chipList($('mon'), CURRENCIES, st.mon, 'data-mon');
  chipList($('cuentas'), CUENTAS, st.cuenta, 'data-cuenta');
  renderAmount();
  if (inTg) {
    try { wa.ready(); wa.expand(); } catch (e) {}
    try { wa.MainButton.onClick(next); } catch (e) {}
    try { wa.BackButton.onClick(back); } catch (e) {}
    if (!canSend) { $('notice').textContent = WRONG_LAUNCH; $('notice').classList.remove('hidden'); }
  } else {
    $('notice').classList.remove('hidden');
  }
  go(1);
})();
</script>
</body>
</html>
